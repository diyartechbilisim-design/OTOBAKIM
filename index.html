    +[...pAlis].sort((a,b)=>b.tarih.localeCompare(a.tarih)).map(a=>`<div class="receipt-row"><span>${fmtDT(a.tarih,a.saat)} — ${a.saticiAd}</span><span><b>${fmt(a.toplam)}</b></span></div>`).join('') :'';

  doPrint(buildReceipt([
    ['Dönem',donemLabel],
    ['Servis Cirosu',fmt(ciro)],
    ['Parça Alım Maliyeti',fmt(mal)],
    ['Gider',fmt(gid)],
    ['Kâr / Zarar',fmt(kar)],
    ['Müşteri Alacağı',fmt(mAl)],
    ['Tedarikçiye Borç',fmt(sB)],
  ],'GÜNLÜK ÖZET RAPORU',donemLabel,undefined,undefined,satisRows+alisRows));
}

async function loadAll() {
  try {
    const fixDate = d => {
      if(!d) return '';
      const s = String(d);
      if(s.includes('T')) return s.split('T')[0];
      if(s.includes('.')) { const [g,a,y]=s.split('.'); return y+'-'+a+'-'+g; }
      return s;
    };
    const [urunler, musteriler, saticilar, alislar, satislar, giderler] = await Promise.all([
      apiGet('/urunler'), apiGet('/musteriler'), apiGet('/saticilar'),
      apiGet('/alislar'), apiGet('/satislar'), apiGet('/giderler')
    ]);
    S.urunler = (urunler||[]).map(u=>({
      id:u.id, ad:u.ad, marka:u.marka||'', kategori:u.kategori||'', birim:u.birim||'Adet',
      stok:parseFloat(u.stok||0), maliyet:parseFloat(u.maliyet||0),
      satisFiyat:parseFloat(u.satisFiyat||u.satis_fiyat||0), sonH:u.sonH||u.son_hareket
    }));
    S.musteriler = (musteriler||[]).map(m=>({
      id:m.id, ad:m.ad, tel:m.tel||'', adres:m.adres||'',
      plaka:m.plaka||'', arac:m.arac||'', sase:m.sase||'', km:parseInt(m.km||0),
      toplamBorc:parseFloat(m.toplamBorc||m.toplam_borc||0),
      odenen:parseFloat(m.odenen||0)
    }));
    S.saticilar = (saticilar||[]).map(t=>({
      id:t.id, ad:t.ad, tel:t.tel||'',
      toplamBorc:parseFloat(t.toplamBorc||t.toplam_borc||0),
      odenen:parseFloat(t.odenen||0)
    }));
    S.alislar = (alislar||[]).map(a=>({
      id:a.id, tarih:fixDate(a.tarih), saat:a.saat||'',
      saticiId:a.saticiId||a.satici_id,
      saticiAd:a.saticiAd||a.satici_ad||'',
      urunler:a.urunler||[],
      toplam:parseFloat(a.toplam||0),
      odemeDurumu:a.odemeDurumu||a.odeme_durumu||'bekliyor',
      odened:parseFloat(a.odened||0),
      aciklama:a.aciklama||''
    }));
    S.satislar = (satislar||[]).map(s=>({
      id:s.id, tarih:fixDate(s.tarih), saat:s.saat||'',
      musteriId:s.musteriId||s.musteri_id,
      musteriAd:s.musteriAd||s.musteri_ad||'',
      urunId:s.urunId||s.urun_id,
      urunAd:s.urunAd||s.urun_ad||'',
      miktar:parseFloat(s.miktar||0),
      satisFiyat:parseFloat(s.satisFiyat||s.satis_fiyat||0),
      toplam:parseFloat(s.toplam||0),
      odemeDurumu:s.odemeDurumu||s.odeme_durumu||'bekliyor',
      odened:parseFloat(s.odened||0),
      aciklama:s.aciklama||'',
      islem:s.islem||'', km:parseInt(s.km||0),
      sonrakiBakim:fixDate(s.sonrakiBakim||s.sonraki_bakim)
    }));
    S.giderler = (giderler||[]).map(g=>({
      id:g.id, tarih:fixDate(g.tarih), saat:g.saat||'',
      aciklama:g.aciklama||'', kategori:g.kategori||'Genel',
      tutar:parseFloat(g.tutar||0)
    }));
    render();
    bakimBildir();
  } catch(e) {
    console.error('Veri yuklenemedi:', e);
    render();
  }
}

function yedekIndir(){
  try{
    if(typeof XLSX==='undefined')return alert('Yedekleme kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.');
    const wb=XLSX.utils.book_new();
    const ekle=(ad,veri)=>{if(veri.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(veri),ad);};
    ekle('Musteriler',S.musteriler.map(m=>({'ID':m.id,'Ad Soyad':m.ad,'Telefon':m.tel,'Adres':m.adres,'Plaka':m.plaka,'Arac':m.arac,'Sasi No':m.sase,'KM':m.km,'Toplam Tutar':m.toplamBorc,'Odenen':m.odenen,'Kalan':m.toplamBorc-m.odenen})));
    ekle('Servisler',S.satislar.map(s=>({'ID':s.id,'Tarih':s.tarih,'Saat':s.saat,'Musteri':s.musteriAd,'Parca/Hizmet':s.urunAd,'Miktar':s.miktar,'Birim Fiyat':s.satisFiyat,'Toplam':s.toplam,'Odeme Durumu':s.odemeDurumu,'Odenen':s.odened,'Yapilan Islem':s.islem,'Servise Gelen KM':s.km,'Sonraki Bakim':s.sonrakiBakim||'','Aciklama':s.aciklama})));
    ekle('Parcalar',S.urunler.map(u=>({'ID':u.id,'Parca':u.ad,'Marka':u.marka,'Kategori':u.kategori,'Birim':u.birim,'Stok':u.stok,'Alis Fiyati':u.maliyet,'Satis Fiyati':u.satisFiyat,'Son Hareket':u.sonH})));
    ekle('Tedarikciler',S.saticilar.map(t=>({'ID':t.id,'Firma':t.ad,'Telefon':t.tel,'Toplam Alim':t.toplamBorc,'Odenen':t.odenen,'Kalan Borc':t.toplamBorc-t.odenen})));
    ekle('Parca Alimlari',S.alislar.map(a=>({'ID':a.id,'Tarih':a.tarih,'Saat':a.saat,'Tedarikci':a.saticiAd,'Parca':a.urunAd,'Miktar':a.miktar,'Birim Fiyat':a.alisFiyat,'Toplam':a.toplam,'Odeme Durumu':a.odemeDurumu,'Odenen':a.odened,'Aciklama':a.aciklama})));
    ekle('Giderler',S.giderler.map(g=>({'ID':g.id,'Tarih':g.tarih,'Saat':g.saat,'Aciklama':g.aciklama,'Kategori':g.kategori,'Tutar':g.tutar})));
    const bugun=new Date().toISOString().split('T')[0];
    XLSX.writeFile(wb,'YerindeBakim-Yedek-'+bugun+'.xlsx');
  }catch(e){alert('Yedek alınamadı: '+e.message);}
}

let bakimBildirildi=false;
function bakimBildir(){
  if(bakimBildirildi||currentRole!=='admin')return;
  const bugun=todayStr();
  const sinir=(()=>{const d=new Date();d.setDate(d.getDate()+30);return d.toISOString().split('T')[0];})();
  const enSon={};
  S.satislar.filter(s=>s.sonrakiBakim).forEach(s=>{if(!enSon[s.musteriId]||s.tarih>enSon[s.musteriId].tarih)enSon[s.musteriId]=s;});
  const yaklasan=Object.values(enSon).filter(s=>s.sonrakiBakim<=sinir).sort((a,b)=>a.sonrakiBakim.localeCompare(b.sonrakiBakim));
  if(!yaklasan.length)return;
  bakimBildirildi=true;
  const items=yaklasan.slice(0,8).map(s=>{
    const m=S.musteriler.find(x=>x.id===s.musteriId);
    const g=s.sonrakiBakim<bugun;
    return `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px"><span><b>${m?.plaka||s.musteriAd}</b>${m?.tel?' · 📞 '+m.tel:''}</span><span style="color:${g?'var(--red)':'var(--yellow)'};font-weight:700;white-space:nowrap">${fmtD(s.sonrakiBakim)}${g?' ⚠️':''}</span></div>`;
  }).join('');
  const el=document.createElement('div');
  el.id='bakim-toast';
  el.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9000;background:var(--surface);border:1.5px solid var(--border2);border-radius:14px;padding:14px 16px;width:min(340px,calc(100vw - 28px));box-shadow:0 12px 40px rgba(0,0,0,.25);animation:slideIn .3s ease';
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:13px">🔔 Bakımı Yaklaşan Araçlar (${yaklasan.length})</b><button onclick="document.getElementById('bakim-toast').remove()" style="border:none;background:var(--surface2);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:14px">×</button></div>${items}${yaklasan.length>8?`<div style="font-size:11px;color:var(--text3);padding-top:4px">+${yaklasan.length-8} araç daha — Özet sayfasında</div>`:''}`;
  document.body.appendChild(el);
}

// ── CLOCK ─────────────────────────────────────────────────────────────────────
function tick(){
  const n=new Date();
  $('clock').textContent=n.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('date-label').textContent=n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(tick,1000);

// ── URL ile otomatik sorgu (WhatsApp linki desteği) ──
(function(){
  try{
    const p=new URLSearchParams(location.search);
    const plaka=p.get('plaka'),sase=p.get('sase');
    if(plaka&&sase){
      switchLoginTab('sorgu');
      $('sorgu-plaka').value=plaka;
      $('sorgu-sase').value=sase;
      history.replaceState({},'',location.pathname);
      sorgula();
    }
  }catch(e){}
})();

// Init
updateBackBtn();
$('login-pass').focus();
</script>
